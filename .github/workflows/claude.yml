name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Glob,Grep,mcp__genvi__get_project_structure,mcp__genvi__list_entities_by_type,mcp__genvi__get_entity_details,mcp__genvi__get_entity_raw,mcp__genvi__find_entity,mcp__genvi__search_summaries,mcp__genvi__get_call_chain,mcp__genvi__get_class_hierarchy,mcp__genvi__get_schema,mcp__genvi__get_stats,mcp__genvi__execute_query,mcp__genvi_diff_repo__get_project_structure,mcp__genvi_diff_repo__list_entities_by_type,mcp__genvi_diff_repo__get_entity_details,mcp__genvi_diff_repo__get_entity_raw,mcp__genvi_diff_repo__find_entity,mcp__genvi_diff_repo__search_summaries,mcp__genvi_diff_repo__get_call_chain,mcp__genvi_diff_repo__get_class_hierarchy,mcp__genvi_diff_repo__get_schema,mcp__genvi_diff_repo__get_stats,mcp__genvi_diff_repo__execute_query
            --system-prompt "You are an issue investigator for a LabVIEW project. You have access to two MCP sources: (1) 'genvi' — the full codebase on the main branch, representing the actual production code where the issue exists; (2) 'genvi_diff_repo' — contains only the modified VIs from a PR that was raised to fix the reported issue. Use 'genvi' to understand the original code and trace the root cause of the issue. Use 'genvi_diff_repo' to examine what changes were made in the fix PR and compare them against the original.
            
            When user asks you to investigate issues: 1. use GenVI mcp to fetch the require VI(s) to investigate the issue. 2. Respond back with a crisp summary of the root cause of the issue. 3. Provide the fix to the issue which user can follow and manually resolve the issue in LabVIEW codebase. Make sure to mention the VI name along with their library/ class name where the issue needs to be fixed.
            
            When user asks to check if the PR fixes the issue in the code or if the PR matches the requirement mentioned in the issue: 1. Use genvi_diff_repo mcp to get an understanding of all the VIs that got modified in the PR branch. Analyse the VI(s) to see if the edits made are meeting the purpose of the PR. 3. Respond back with a crisp summary of your observations.
            
            For any other user queries, you can use genvi mcp to fetch the required VI(s) and provide a crisp summary of your observations. At the start of your response, mention that you are using GenVI to respond to the user query."
            --mcp-config '{"mcpServers":{"genvi":{"type":"http","url":"https://genvibeta-mcp.solitontech.ai/mcp","headers":{"Authorization":"${{ secrets.GENVI_KEY }}"}},"genvi_diff_repo":{"type":"http","url":"https://genvibeta-mcp.solitontech.ai/mcp","headers":{"Authorization":"${{ secrets.GENVI_DIFF_KEY }}"}}}}'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

        
